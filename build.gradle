plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'io.github.tarun922.lifabt'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

gradlePlugin {
    plugins {
        lifabt {
            id = 'io.github.tarun922.lifabt'
            implementationClass = 'io.github.tarun922.lifabt.LifabtPlugin'
            displayName = 'lifabt - Lucide icons for Android by Tarun'
            description = 'Downloads Lucide icons and converts them to Android VectorDrawables at build time.'
        }
    }
}
